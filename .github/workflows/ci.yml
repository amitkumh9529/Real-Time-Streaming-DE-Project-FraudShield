name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Lint, Secret Scan & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Automated Secret & Credential Check
        run: |
          echo "Scanning for accidental secret leaks..."
          # Verify no private keys, real tokens, or passwords are committed
          ! grep -rnE "cfltbMZTBsGT29a|5OVF32EJBUO|lkls hreo|databeli1[34]@gmail" . --exclude-dir=".git" --exclude-dir=".pytest_cache"

      - name: Code Formatting & Linting Check (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run Pytest Test Suite
        run: |
          pytest --cov=core --cov=services --cov=kafka_producer -v
